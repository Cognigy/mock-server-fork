version: "2.4"
services:
  mockServer:
    image: mockserver/mockserver:mockserver-snapshot@sha256:03071c7e337db33f1a41a971911b4a21fbdc83fac041181ea44d08eec8434272
    ports:
      - 1080:1080
    environment:
      MOCKSERVER_PROPERTY_FILE: /config/mockserver.properties
      MOCKSERVER_INITIALIZATION_JSON_PATH: /config/initializerJson.json
    volumes:
      - type: bind
        source: .
        target: /config